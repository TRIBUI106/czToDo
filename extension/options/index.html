<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>czToDo Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --color-primary: #3b82f6;
      --color-success: #10b981;
      --color-error: #ef4444;
      --color-border: #e5e7eb;
      --color-bg: #ffffff;
      --color-text: #1f2937;
      --color-text-light: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1f2937;
        --color-text: #f3f4f6;
        --color-text-light: #d1d5db;
        --color-border: #374151;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .section {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 12px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    button {
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background-color: var(--color-bg);
      color: var(--color-text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      margin-right: 8px;
      margin-bottom: 12px;
    }

    button:hover {
      background-color: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    button.danger {
      color: var(--color-error);
      border-color: var(--color-error);
    }

    button.danger:hover {
      background-color: var(--color-error);
      color: white;
    }

    .status-message {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .status-message.success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .status-message.error {
      background-color: #fee2e2;
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    .status-message.info {
      background-color: #dbeafe;
      color: #1e3a8a;
      border: 1px solid #93c5fd;
    }

    .hidden {
      display: none;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .status-row:last-child {
      border-bottom: none;
    }

    .status-value {
      font-weight: 500;
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>czToDo Settings</h1>

    <div id="statusMessage"></div>

    <!-- GitHub Settings -->
    <div class="section">
      <div class="section-title">GitHub Integration</div>

      <label for="githubToken">GitHub Personal Access Token</label>
      <input
        type="password"
        id="githubToken"
        placeholder="ghp_..."
        autocomplete="off"
      >
      <p style="font-size: 12px; color: var(--color-text-light);">
        Create a token at
        <a href="https://github.com/settings/tokens" target="_blank"
          style="color: var(--color-primary);">github.com/settings/tokens</a>
        with <code>repo</code> scope to sync assigned issues.
      </p>

      <button id="saveGithubToken">Save Token</button>
      <button id="testGithubToken" class="danger">Test Token</button>
      <button id="removeGithubToken" class="danger">Remove Token</button>

      <div style="margin-top: 16px;">
        <div class="status-row">
          <span>Token Status:</span>
          <span id="tokenStatus" class="status-value">Not configured</span>
        </div>
        <div class="status-row">
          <span>Last Sync:</span>
          <span id="lastSync" class="status-value">Never</span>
        </div>
      </div>

      <button
        id="syncNow"
        style="margin-top: 12px; background-color: var(--color-success); color: white; border-color: var(--color-success);"
      >
        Sync Now
      </button>
    </div>

    <!-- Account Settings -->
    <div class="section">
      <div class="section-title">Account</div>

      <div id="userInfo"></div>

      <button id="logout" class="danger">Logout</button>
    </div>

    <!-- Diagnostic Info -->
    <div class="section">
      <div class="section-title">Diagnostics</div>

      <div id="diagnostics" style="font-size: 12px; color: var(--color-text-light); line-height: 1.6;">
        Loading...
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
